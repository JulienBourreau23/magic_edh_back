# Flow Kestra — rafraîchissement des recommandations EDHREC.
#
# **Passé de HTTP à SSH** le jour où la collection a franchi la centaine de
# commandants. Le sync fait une requête par commandant **et par archétype**,
# avec une pause d'une seconde entre chaque par politesse envers un site
# communautaire gratuit : à 36 commandants il tenait en une minute, à 131 il en
# demande seize. L'endpoint HTTP `/admin/sync-edhrec` est synchrone et ne
# renvoie rien avant la fin, donc Kestra comptait ces seize minutes comme de
# l'inactivité et coupait la connexion à dix.
#
# Ce n'était pas un bug mais un seuil franchi, et il le sera de nouveau : le
# coût croît avec la collection. D'où le passage au mécanisme prévu pour ça.
#
# L'endpoint HTTP reste en place — même implémentation dans `services/edhrec.py`,
# utilisable à la main sur une petite collection.
#
# Prérequis dans Kestra (Namespace > KV Store) : les mêmes clés SSH que le flow
# Scryfall (mtg_back_ssh_host, _port, _user, _key).
#
# Écrit pour Kestra 1.3.31 OSS et le plugin `fs` 2.11.1.
id: sync-edhrec
namespace: mtg-edh

description: |
  Récupère les cartes qu'EDHREC voit jouées avec les commandants présents dans
  la collection, et les archétypes de chacun. Alimente « Quel deck monter » et
  la construction de deck compétitif.

tasks:
  - id: edhrec
    type: io.kestra.plugin.fs.ssh.Command
    host: "{{ kv('mtg_back_ssh_host') }}"
    port: "{{ kv('mtg_back_ssh_port') }}"
    username: "{{ kv('mtg_back_ssh_user') }}"
    authMethod: PUBLIC_KEY
    privateKey: "{{ kv('mtg_back_ssh_key') }}"
    # Un seul mot : la clé étant contrainte par `command=`, ceci n'est pas une
    # commande shell mais l'aiguillage lu par kestra-sync.sh.
    commands:
      - edhrec
    # Large devant les seize minutes actuelles : la durée suit la collection,
    # et on préfère une marge à un flow qui casse au prochain palier.
    timeout: PT45M
    # Pas de retry : la tâche n'est pas une requête unique mais des centaines
    # d'appels à un site communautaire gratuit. La rejouer entière pour un
    # échec passager doublerait la visite.

triggers:
  # EDHREC agrège des decks sur la durée : ses chiffres bougent lentement.
  # Une fois par semaine suffit largement, et c'est plus poli qu'un quotidien.
  - id: hebdomadaire
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 4 * * 1"

errors:
  - id: alerte
    type: io.kestra.plugin.core.log.Log
    level: ERROR
    message: "Échec de la synchronisation EDHREC — voir l'exécution {{ execution.id }}"
